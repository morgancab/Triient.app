<!DOCTYPE html>
<!-- Fichier généré par scripts/build.mjs : modifier les sources dans src/ (page.html, style.css, js/), puis lancer node scripts/build.mjs -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triient">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Plan d’entraînement triathlon sur mesure : choisis ta course, suis tes séances, synchronise Garmin.">
<title>Triient</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="preload" as="image" href="hero.jpg" fetchpriority="high">
<script>if(/[?&](appareil|profil)=/.test(location.search)&&(/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)||location.protocol==='file:'))document.write('<script src="dev-appareil.js"><\/script>');</script>
<style>
:root{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--sep:rgba(84,84,88,.5);
  --t1:#f5f4ef;--t2:#a9a8a0;--t3:#85847d;--acc:#f5f4ef;--grid:#2c2c2e;--axis:#48484a;
  --swim:#3987e5;--bike:#199e70;--run:#d95926;--str:#98989f;
  --good:#0ca30c;--warn:#fab219;--ser:#ec835a;--crit:#d03b3b;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t1);min-height:100vh;min-height:100dvh;
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button:disabled{opacity:.3;cursor:default}
.ic{display:block;flex:none}
#statusbg{position:fixed;top:0;left:0;right:0;height:var(--sat);background:rgba(0,0,0,.72);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);z-index:30}
#view{max-width:640px;margin:0 auto;padding:calc(var(--sat) + 14px) 16px calc(92px + var(--sab))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:var(--sab);
  background:rgba(22,22,24,.82);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid var(--sep)}
.tabbar-in{display:flex;max-width:640px;margin:0 auto}
.tab{flex:1;min-height:52px;border:0;background:none;color:var(--t3);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:6px 0 4px;font-size:10.5px;font-weight:600;letter-spacing:.01em}
.tab[aria-selected=true]{color:var(--t1)}

/* ---------- Typographie & composants ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t2)}
h1{margin:3px 0 0;font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.02em}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--t1);display:grid;place-items:center;flex:none}
.card{background:var(--card);border-radius:20px;padding:16px;margin:0 0 14px}
.card h2{margin:0 0 12px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.card h2 small{font-weight:500;color:var(--t2);font-size:13px;margin-left:6px}
.muted{color:var(--t2)}.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--t2);white-space:nowrap}
.chip.hl{background:var(--t1);color:#000}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}

.hero{text-align:center;padding:22px 16px 18px;background:linear-gradient(160deg,#262932,#15161b)}
.hero .big{font-size:80px;line-height:1;font-weight:800;letter-spacing:-.035em;margin-top:6px}
.hero .unit{font-size:15px;font-weight:600;color:var(--t2);margin-top:2px}
.cd{display:flex;justify-content:center;gap:10px;margin-top:16px}
.cd div{min-width:68px;background:rgba(255,255,255,.07);border-radius:14px;padding:9px 6px}
.cd b{display:block;font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.cd span{font-size:10.5px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
.hero .date{margin-top:16px;font-size:14px;color:var(--t2)}
.hero .state{margin-top:6px;font-size:14px;font-weight:600}

.pr{margin:0 0 15px}.pr:last-child{margin:0}
.pr-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px;font-size:14px}
.pr-h b{font-weight:600}.pr-h span{color:var(--t2);font-variant-numeric:tabular-nums;font-size:13.5px}
.bar{height:8px;border-radius:4px;background:#2f2f32;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--acc));width:var(--p,0%);transition:width .35s}
.tot{display:flex;align-items:baseline;gap:8px;margin:2px 0 16px}
.tot b{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1}
.tot span{color:var(--t2);font-size:14px}
.sp-swim{--c:var(--swim);--cb:rgba(57,135,229,.18)}
.sp-bike{--c:var(--bike);--cb:rgba(25,158,112,.18)}
.sp-run,.sp-brick{--c:var(--run);--cb:rgba(217,89,38,.18)}
.sp-str{--c:var(--str);--cb:rgba(152,152,159,.18)}
.sp-rest{--c:var(--str);--cb:rgba(152,152,159,.12)}
.sp-race{--c:#f5f4ef;--cb:rgba(245,244,239,.14)}
.spr{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.spr:last-child{margin:0}
.spr .ico{flex:none;width:38px;height:38px;border-radius:11px;background:var(--cb);color:var(--c);display:grid;place-items:center}
.spr .bd{flex:1;min-width:0}

.legend{display:flex;gap:14px;margin:10px 0 2px;font-size:12.5px;color:var(--t2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.readout{margin-top:8px;font-size:13.5px;color:var(--t2);min-height:20px}
.readout b{color:var(--t1);font-weight:600}
svg text{font-family:inherit}
.chartwrap svg{width:100%;height:auto;display:block;touch-action:manipulation}
svg[data-ch]{touch-action:pan-y;cursor:crosshair}

.next{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--card2);border-radius:16px;padding:12px;text-align:left}
.next .ico{flex:none;width:42px;height:42px;border-radius:12px;background:var(--cb);color:var(--c);display:grid;place-items:center}

/* ---------- Navigation semaine ---------- */
.nav{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.nav-c{flex:1;text-align:center;min-width:0;border:0;background:none;color:inherit;font-family:inherit;padding:0}
.nav-c svg{display:inline-block;margin-left:4px;vertical-align:-2px;color:var(--t3)}
.nav-c b{display:block;font-size:17px;font-weight:700}
.nav-c small{display:block;color:var(--t2);font-size:13px;margin-top:1px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:14px;color:var(--t2)}
.banner b{color:var(--t1)}
.theme{background:linear-gradient(160deg,#262932,#1a1b21)}
.theme .t{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:6px 0 8px}
.theme p{margin:0;font-size:14.5px;color:#d3d2ca}
.day{margin:22px 0 9px;display:flex;align-items:baseline;gap:8px}
.day h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.day small{color:var(--t2);font-size:13.5px}
.day .sp{flex:1}
.sess{background:var(--card);border-radius:18px;margin:0 0 10px;overflow:hidden}
.s-row{display:flex;align-items:stretch}
.s-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:13px 2px 13px 13px;background:none;border:0;text-align:left}
.s-ic{flex:none;width:44px;height:44px;border-radius:13px;background:var(--cb);color:var(--c);display:grid;place-items:center}
.s-txt{flex:1;min-width:0}
.s-t{display:block;font-weight:650;font-size:16px;line-height:1.25}
.s-m{display:block;font-size:13px;color:var(--t2);margin-top:2px}
.s-chev{flex:none;color:var(--t3);transition:transform .2s;margin-right:2px}
.sess.open .s-chev{transform:rotate(180deg)}
.chk{flex:none;width:58px;border:0;background:none;display:grid;place-items:center}
.chk i{width:30px;height:30px;border-radius:50%;border:2px solid #636366;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.chk[aria-checked=true] i{background:var(--c);border-color:var(--c);color:#fff}
.sess.done .s-t{color:var(--t2)}
.s-det{display:none;padding:2px 16px 15px;border-top:.5px solid var(--sep)}
.sess.open .s-det{display:block}
.s-det ul{margin:12px 0 0;padding:0;list-style:none}
.s-det li{position:relative;padding-left:16px;margin:0 0 8px;font-size:14.5px;color:#d6d5cd}
.s-det li:before{content:'';position:absolute;left:1px;top:.5em;width:6px;height:6px;border-radius:50%;background:var(--c)}
.goal{margin-top:12px;font-size:14px;color:var(--t1);background:rgba(255,255,255,.06);border-radius:12px;padding:9px 12px}
.goal b{font-weight:650;color:var(--t2);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.inp{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;margin:0 0 8px;font-size:14.5px}
.inp small{display:block;color:var(--t2);font-size:12px}
.inp input{height:44px;border-radius:12px;border:0;background:var(--card2);color:var(--t1);font-size:16px;font-family:inherit;padding:0 12px;width:100%;text-align:right}
.act{margin-top:12px;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px}
.act>b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);font-weight:650;margin-bottom:3px}
.act .an{font-weight:600;font-size:15px}
.sv{color:var(--t1);font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);border-radius:6px;padding:1px 6px;margin-right:2px}
.srow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--card2);border-radius:14px;padding:11px 12px;margin:0 0 8px;text-align:left;min-height:56px}
.sr-t{flex:1;min-width:0}
.sr-t b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-t small{display:block;color:var(--t2);font-size:12.5px;margin-top:1px}
.sr-b{flex:none;max-width:42%;text-align:right;font-size:12px;color:var(--t2)}
.sr-b.ok{color:var(--t1);font-weight:600}
.inp.wide{grid-template-columns:1fr}
.inp.wide input{text-align:left}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:0 0 16px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:none;color:var(--t2);font-size:14px;font-weight:600}
.seg button[aria-pressed=true]{background:#3a3a3d;color:var(--t1)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.kpi{background:var(--card);border-radius:16px;padding:12px 11px;min-width:0}
.sheet .kpi{background:var(--card2)}
.kl{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t2)}
.kv{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.ks{font-size:11.5px;color:var(--t2);margin-top:3px;line-height:1.25}
.inp.tp-f{grid-template-columns:1fr auto}
.tval{min-width:120px;height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--card2);color:var(--t1);font-size:16px;font-weight:600;font-family:inherit;font-variant-numeric:tabular-nums;white-space:nowrap}
.tval.unset{color:var(--t2);font-weight:500}   /* pas « empty » : déjà pris par les cartes d'état vide (grande marge intérieure) */
.sheet .tval{background:var(--card3)}
.tp-bg{position:fixed;left:0;right:0;top:0;bottom:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.tp-bg.on{opacity:1;pointer-events:auto}
.tp{width:100%;max-width:520px;background:var(--card2);border-radius:20px 20px 0 0;padding:6px 16px calc(20px + var(--sab));transform:translateY(24px);transition:transform .2s}
.tp-bg.on .tp{transform:none}
.tp-h{display:flex;align-items:center;gap:8px;min-height:52px}
.tp-h b{flex:1;min-width:0;text-align:center;font-size:15px;font-weight:600}
.tp-h button{flex:none;min-width:76px;min-height:44px;border:0;background:none;color:var(--t2);font-family:inherit;font-size:15px;text-align:left;padding:0}
.tp-h button.ok{color:var(--t1);font-weight:700;text-align:right}
.tp-w{position:relative;display:flex;justify-content:center;gap:6px;height:200px}
.tp-w::before{content:'';position:absolute;left:0;right:0;top:80px;height:40px;border-radius:10px;background:rgba(255,255,255,.09);pointer-events:none}
.tw-col{position:relative;display:flex;align-items:center;flex:1;max-width:130px;min-width:0}
.tw-list{flex:1;min-width:0;height:200px;padding:80px 0;box-sizing:border-box;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;outline:0;-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.tw-list::-webkit-scrollbar{display:none}
.tw-item{height:40px;line-height:40px;text-align:right;padding-right:6px;scroll-snap-align:center;font-size:22px;color:var(--t2);font-variant-numeric:tabular-nums;cursor:pointer}
.tw-item.on{color:var(--t1);font-weight:600}
.tw-unit{flex:none;width:34px;font-size:14px;color:var(--t2)}
.rng{display:flex;gap:6px;margin:0 0 6px}
.rng button{border:0;background:var(--card2);color:var(--t2);border-radius:999px;height:30px;padding:0 12px;font-size:12.5px;font-weight:600}
.rng button[aria-pressed=true]{background:var(--t1);color:#000}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}
.mt div{font-size:12px;color:var(--t2)}
.mt b{display:block;font-size:16px;color:var(--t1);font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.zbar{display:flex;gap:2px;height:14px;margin:4px 0 10px}
.zbar span{display:block;min-width:2px;border-radius:3px}
.zrow{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.zrow i{width:10px;height:10px;border-radius:3px;flex:none}
.zrow span:last-child{margin-left:auto;color:var(--t2);font-variant-numeric:tabular-nums}
.ivr{display:grid;grid-template-columns:30px 1.1fr 1fr 1fr .8fr;gap:6px;font-size:13px;padding:7px 0;border-bottom:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.ivr.h{color:var(--t2);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.ivr.rest{color:var(--t3);font-size:12px;padding:4px 0}
.spl{display:grid;grid-template-columns:44px 1fr 66px 34px;align-items:center;gap:8px;font-size:12.5px;margin:7px 0;font-variant-numeric:tabular-nums}
.spl .b{height:10px;border-radius:5px;background:var(--c)}
.dh{font-size:15px;font-weight:700;margin:0 0 8px}
.dh small{font-weight:500;color:var(--t2);font-size:12px;margin-left:6px}
#tip{position:fixed;z-index:70;pointer-events:none;background:#2c2c2e;border:.5px solid rgba(120,120,128,.6);border-radius:12px;padding:8px 11px;font-size:12.5px;line-height:1.4;box-shadow:0 8px 28px rgba(0,0,0,.55);max-width:250px;opacity:0;transition:opacity .08s;left:0;top:0}
#tip.on{opacity:1}
#tip b{font-weight:650}
#tip .tm{color:var(--t2)}
.dates{display:flex;gap:10px;margin:8px 0 0}
.dates label{flex:1;font-size:12px;color:var(--t2)}
.dates input{display:block;width:100%;height:40px;margin-top:3px;border-radius:10px;border:0;background:var(--card2);color:var(--t1);font-size:15px;padding:0 10px;font-family:inherit;color-scheme:dark}
.rhero{text-align:center;padding:20px 16px 18px;background:linear-gradient(160deg,#262932,#15161b)}
.rhero .big{font-size:54px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.rline{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.rline:last-child{margin:0}
.rline .ico{flex:none;width:38px;height:38px;border-radius:11px;background:var(--cb);color:var(--c);display:grid;place-items:center}
.rline .bd{flex:1;min-width:0}
.rline .t{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.rline small{display:block;color:var(--t2);font-size:12px;margin-top:2px;line-height:1.3}
.cf{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;background:rgba(255,255,255,.12);color:var(--t1)}
.warn{display:flex;gap:10px;background:rgba(250,178,25,.10);border:1px solid rgba(250,178,25,.4);border-radius:14px;padding:10px 12px;font-size:13px;color:#ecd9a8;margin:0 0 14px}
.warn svg{color:var(--warn);flex:none;margin-top:1px}
.sec-t{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--t2);font-weight:650;margin:16px 0 4px}
.sub-t{font-size:13px;font-weight:700;color:var(--t1);margin:12px 0 2px}
.st{display:flex;gap:12px;padding:10px 0;border-bottom:.5px solid var(--sep)}
.st:last-child{border-bottom:0}
.st .du{flex:none;width:62px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.3}
.st .bd{flex:1;min-width:0}
.st .nm{font-weight:650;font-size:14.5px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cp{font-size:12px;font-weight:650;padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.08);color:var(--t1);white-space:nowrap;font-variant-numeric:tabular-nums}
.cp.pc{background:var(--cb);color:var(--c)}
.cp.rpe{background:none;border:1px solid rgba(255,255,255,.18);color:var(--t2);font-weight:600}
.rep{margin:6px 0;padding:2px 0 2px 12px;border-left:3px solid var(--c);border-radius:2px}
.rep .rh{font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--c);text-transform:uppercase;margin-top:4px}
.rep .st:last-child{border-bottom:0}
.tip{margin-top:10px;font-size:13.5px;color:var(--t2);background:rgba(255,255,255,.05);border-radius:12px;padding:9px 12px}
.legendrpe{font-size:13px;color:var(--t2);line-height:1.5}
.legendrpe b{color:var(--t1);font-weight:600}

/* ---------- Plan 26 semaines ---------- */
.tl{position:relative;margin:14px 0 14px}
.tl-now{position:absolute;top:0;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--t1);white-space:nowrap}
.tl-flags{position:relative;height:18px;margin-top:16px}
.tl-flag{position:absolute;bottom:1px;transform:translateX(-3px);color:var(--t1);line-height:0}
.tl-flag svg{display:block}
.tl-bars{display:flex;align-items:flex-end;gap:2px;height:64px}
.tl-b{flex:1;min-width:0;height:100%;padding:0;border:0;background:none;display:flex;align-items:flex-end}

.sheet-bg.on .sheet{transform:none}
.sheet h2{margin:0;font-size:22px;font-weight:800}
.sheet h4{margin:20px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);font-weight:600}
.sheet p{margin:0 0 10px;font-size:14.5px;color:#d3d2ca}
.btn{height:48px;border-radius:14px;border:0;background:var(--card2);color:var(--t1);font-size:16px;font-weight:600;padding:0 16px;width:100%;margin:0 0 8px}
.btn.pri{background:var(--t1);color:#000}
.btn.dng{color:#ff7a70}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .btn{margin:0}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translate(-50%,20px);background:#3a3a3c;color:#fff;padding:10px 16px;border-radius:14px;
  font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.install{display:flex;gap:12px;align-items:flex-start}
.install p{margin:0;font-size:14px;color:#d3d2ca}
.install b{color:var(--t1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){h1{font-size:38px}}
/* ================= Design v2 : socle ================= */
:root{--bg:#000;--card:#141416;--card2:#1f1f23;--card3:#2a2a30;--sep:rgba(255,255,255,.08);--brd:rgba(255,255,255,.07);--r:24px;--t2:#a8a8b0;--t3:#7e7e87}
body::before{content:'';position:fixed;left:0;right:0;top:0;height:460px;z-index:-1;pointer-events:none;background:radial-gradient(80% 100% at 50% 0%,rgba(76,96,170,.20),transparent 70%)}
html{scroll-behavior:smooth}
#view{padding:calc(var(--sat) + 10px) 16px calc(108px + var(--sab))}
#view.enter>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.04s}#view.enter>*:nth-child(3){animation-delay:.08s}#view.enter>*:nth-child(4){animation-delay:.12s}#view.enter>*:nth-child(5){animation-delay:.16s}#view.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
h1{font-size:32px;letter-spacing:-.035em}
.top{margin:4px 0 18px;align-items:center;gap:10px}
.top-t{flex:1;min-width:0}
.top .eyebrow{margin-bottom:1px}
.iconbtn{background:var(--card);box-shadow:inset 0 0 0 1px var(--brd);transition:transform .15s,background .15s}
.iconbtn:active{transform:scale(.92);background:var(--card2)}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:0 0 16px;box-shadow:inset 0 0 0 1px var(--brd)}
.card h2{font-size:18px;margin-bottom:14px}
.sh{display:flex;align-items:center;gap:10px;margin:24px 2px 10px}
.sh h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sh .muted{margin-left:auto}
.lnk{margin-left:auto;display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--t2);font-size:14px;font-weight:600;padding:6px 0 6px 10px}
.mi{flex:none;width:44px;height:44px;border-radius:14px;background:var(--card3);display:grid;place-items:center}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px}
/* barre d'onglets */
.tabbar{background:rgba(12,12,14,.8);border-top:1px solid var(--brd)}
.tab{min-height:58px;gap:2px;font-size:10.5px;padding:7px 0 5px}
.tab .ti{width:58px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.tab[aria-selected=true] .ti{background:rgba(255,255,255,.14)}
/* boutons */
.btn{height:52px;border-radius:16px;font-size:16px;font-weight:650;transition:transform .12s,opacity .12s;background:var(--card3)}
.btn:active{transform:scale(.98);opacity:.9}
.btn.pri{background:var(--t1);color:#000}
.chip{background:var(--card3);font-size:12px;padding:4px 10px}
/* accueil : compte à rebours + anneau */
.hero2{display:flex;align-items:center;gap:14px;padding:20px 18px;background:radial-gradient(120% 140% at 0% 0%,rgba(80,110,200,.24),transparent 60%),linear-gradient(165deg,#1b1d27,#101114)}
.hero2 .h2l{flex:1;min-width:0}
.hero2 .big{font-size:78px;line-height:.95;font-weight:800;letter-spacing:-.05em;margin-top:6px;font-variant-numeric:tabular-nums}
.hero2 .unit{font-size:14px;font-weight:600;color:var(--t2);margin-top:4px}
.cd2{display:flex;gap:6px;margin-top:14px;font-size:12.5px;color:var(--t2)}
.cd2 span{background:rgba(255,255,255,.07);border-radius:10px;padding:5px 9px;white-space:nowrap}
.cd2 b{color:var(--t1);font-variant-numeric:tabular-nums;font-size:15px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .rc{position:absolute;left:0;right:0;top:0;bottom:0;display:grid;place-content:center;text-align:center}
.ring .rc b{font-size:23px;font-weight:800;line-height:1}
.ring .rc small{font-size:11px;color:var(--t2);margin-top:2px}
/* bandeau de la semaine */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 16px}
.wd7{border:0;background:var(--card2);border-radius:18px;padding:9px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;transition:transform .12s}
.wd7:active{transform:scale(.95)}
.wd7 .dl{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--t3)}
.wd7 .dn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.wd7.today{background:rgba(255,255,255,.11)}
.wd7.today .dn{background:var(--t1);color:#000}
.wd7 .dd{display:flex;gap:3px;height:7px;align-items:center;justify-content:center}
.wd7 .dd i{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--c);background:transparent}
.wd7 .dd i.d{background:var(--c)}
.wd7.rest .dd i{box-shadow:none;background:transparent}
/* cartes de séance */
.sess{border-radius:22px;box-shadow:inset 0 0 0 1px var(--brd);background:var(--card);position:relative;margin:0 0 12px}
.sess::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.sess.sp-rest::before,.sess.sp-str::before{opacity:.5}
.s-main{padding:15px 4px 15px 18px;gap:14px}
.s-ic{width:48px;height:48px;border-radius:15px}
.s-ov{display:block;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--c)}
.s-t{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:1px;line-height:1.25}
.s-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mc{font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--t2);white-space:nowrap}
.mc.dur{background:var(--cb);color:var(--c)}
.s-sum{display:block;font-size:13px;color:var(--t2);margin-top:7px;line-height:1.35}
.chk{width:62px}
.chk i{width:34px;height:34px;border-color:#55555d}
.chk[aria-checked=true] i{animation:pop .32s}
.sess.done .s-t{color:var(--t2)}
.sess.done .s-ic{opacity:.55}
.s-det{padding:2px 18px 18px;border-top:1px solid var(--sep)}
.sess.open{background:linear-gradient(180deg,var(--card),#111113)}
/* menu « Plus » et groupes repliables */
.menu{background:var(--card);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--brd);overflow:hidden;margin:0 0 16px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;padding:14px 16px;border-bottom:1px solid var(--sep);color:var(--t1)}
.mrow:last-child{border-bottom:0}
.mrow:active{background:rgba(255,255,255,.05)}
.mrow b{display:block;font-size:16px;font-weight:650}
.mrow small{display:block;color:var(--t2);font-size:13px;margin-top:1px;line-height:1.3}
.mrow>svg{color:var(--t3)}
.fold{background:var(--card);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--brd);margin:0 0 16px}
.fold>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 18px;font-weight:650;cursor:pointer}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--t3);border-bottom:2px solid var(--t3);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
.fold[open]>summary::after{transform:rotate(-135deg)}
.fold .fbody{padding:0 18px 18px}
.fold summary small{display:block;color:var(--t2);font-weight:500;font-size:12.5px;margin-top:1px}
.sheet{background:#141416;border-radius:28px 28px 0 0}
.sheet::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:-6px auto 14px}
/* vue semaine */
.theme{background:radial-gradient(120% 140% at 0% 0%,rgba(80,110,200,.16),transparent 60%),linear-gradient(165deg,#1a1c24,#121316)}
.theme .t{font-size:19px}
.theme p{font-size:14px;line-height:1.45}
.wprog{margin-top:14px;padding-top:14px;border-top:1px solid var(--sep)}
.wprog .row{margin-bottom:8px}
.day{margin:26px 2px 10px;scroll-margin-top:12px}
.day h3{font-size:21px;font-weight:800}
.legendrpe{font-size:14px;line-height:1.55;color:var(--t2)}
.legendrpe b{color:var(--t1)}
.fold summary>svg{flex:none;color:var(--t2)}
/* réglages + bienvenue */
.sheet .fold{background:var(--card2);box-shadow:none;margin:0 0 10px;border-radius:20px}
.sheet .fold .fbody{padding:0 16px 16px}
.sheet .fold .fbody>h4{display:none}
.sheet .fold .fbody>p:first-child{margin-top:0}
.sheet .fold summary .mi{background:var(--card3);width:36px;height:36px;border-radius:11px;flex:none}
.sheet .inp input,.sheet textarea{background:var(--card3)}
.sheet .dng-z{margin:18px 0 6px}
.wl{text-align:center;padding:6px 4px 0}
.wl .logo{width:76px;height:76px;border-radius:22px;margin:4px auto 14px;display:grid;place-items:center;background:linear-gradient(150deg,#3b4a86,#1b2036);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.wl h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
.wl .lead{color:var(--t2);font-size:15.5px;line-height:1.45;margin:0 12px 20px}
.wl ul{list-style:none;margin:0 0 20px;padding:0;text-align:left}
.wl li{display:flex;gap:14px;align-items:flex-start;padding:10px 4px}
.wl li .mi{width:42px;height:42px;border-radius:13px;background:var(--card3)}
.wl li b{display:block;font-size:15.5px}
.wl li div>span{display:block;color:var(--t2);font-size:13.5px;line-height:1.35;margin-top:1px}
.wl li .mi{display:grid;place-items:center;flex:none}
.wl .btn{margin:0 0 10px}
/* états vides */
.empty{text-align:center;padding:26px 20px 22px}
.empty .mi{width:60px;height:60px;border-radius:19px;margin:0 auto 14px}
.empty h2{font-size:21px;margin:0 0 6px}
.empty>p{color:var(--t2);font-size:14.5px;line-height:1.45;margin:0 auto 16px;max-width:30em}
.empty .req{text-align:left;border-top:1px solid var(--sep);padding:14px 0;margin:0}
.empty .req:last-of-type{padding-bottom:2px}
.empty .btn{margin:16px 0 0}
/* accessibilité clavier + divers */
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.75);outline-offset:2px;border-radius:12px}
.tab:focus-visible{outline-offset:-4px}
.card .srow:first-of-type{margin-top:0}
/* Accueil (unslop) : étiquettes en minuscules, graisses 500 à 600, grille de 4 px. Le vert ne marque que la séance du jour à cocher
   et le plan réalisé ; les choix de séance manquée sont neutres ; les infos de séance sont du texte, plus des pastilles */
.home .eyebrow{font-size:13px;font-weight:500;letter-spacing:0;text-transform:none}
.home .sh{margin:32px 0 12px}
.home .sh h2{font-size:20px;font-weight:600;letter-spacing:0}
.home .card{padding:20px}
.home .hline{margin:12px 0 16px}
.home .h3-in{padding:20px}
.home .hero3 .eyebrow{font-size:13px;color:rgba(255,255,255,.8)}
.home .ring .rc b{font-weight:600}
.home .cd2{gap:8px;margin-top:12px}
.home .cd2 span{padding:4px 8px;border-radius:8px}
.home .miss-c{box-shadow:inset 0 0 0 1px var(--brd)}
.home .miss-c h2{font-weight:600}
.home .miss-b .btn{height:44px;font-size:15px;font-weight:500}
.home .miss-b .btn.pri{background:var(--card3,#2a2a30);color:var(--t1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.home .sess::before{display:none}
.home .s-ov{font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--t2)}
.home .s-t{font-weight:600;letter-spacing:0}
.home .s-m{gap:4px 8px;margin-top:4px}
.home .mc{padding:0;border-radius:0;background:none;font-size:13px;font-weight:500;color:var(--t2)}
.home .mc.dur{background:none;color:var(--t1)}
.home .s-m .mc+.mc::before{content:'·';margin-right:8px;color:var(--t3)}
.home .chk i{border-color:var(--brand)}
.home .chk[aria-checked=true] i{background:var(--brand);border-color:var(--brand);color:var(--ink)}
.home .wkcard{padding:20px}
.home .wkcard .bar i{background:var(--t2)}
.home .wkline b{font-weight:600}
.home .kl{font-size:12px;font-weight:500;letter-spacing:0;text-transform:none}
.home .kv{font-weight:600;letter-spacing:0}
.home .kpi{padding:12px}
.home .dbig{font-weight:600}
.sync-s{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--t2)}
.sync-s i{width:8px;height:8px;border-radius:50%;background:#30d158}
.sync-s.off i{background:#ff9f0a}
/* fiche d'activité */
.shead{position:sticky;top:-18px;z-index:3;margin:-18px -16px 14px;padding:18px 16px 12px;background:linear-gradient(#141416 82%,rgba(20,20,22,0))}
.shead>div h2{line-height:1.2}
.ad-ic{width:42px;height:42px;border-radius:13px;background:var(--cb);color:var(--c);display:grid;place-items:center;flex:none;margin-right:12px}
.ad-hero{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:8px;padding:16px 18px 17px;margin:0 0 12px;border-radius:22px;background:linear-gradient(155deg,var(--cb),rgba(255,255,255,.025) 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.ad-hero>div{min-width:0}
.ad-hero .kl{display:block}
.ad-hero b{display:block;font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ad-hero b small{font-size:12.5px;font-weight:650;color:var(--t2);letter-spacing:0;margin-left:3px}
.ad-ch{background:var(--card2);padding:14px 14px 12px;margin:0 0 12px;border-radius:20px;box-shadow:none}
.ad-ch .dh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.dstat{margin-left:auto;font-size:12.5px;color:var(--t2);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dstat b{color:var(--t1);font-weight:700}
.pl{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--t3);margin-top:8px}
.pl i{width:16px;height:10px;border-radius:3px;background:rgba(255,255,255,.16)}
.ad-plan{border-left:3px solid var(--c);border-radius:6px 16px 16px 6px;background:var(--card2);margin:0 0 12px}
.skel i{display:block;height:150px;border-radius:20px;margin:0 0 12px;background:linear-gradient(100deg,var(--card2) 30%,var(--card3) 50%,var(--card2) 70%);background-size:250% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
.spl .b{opacity:.5}
.spl .b.fast{opacity:1}
.spl .pf{font-weight:700;color:var(--t1)}
/* balayage entre semaines */
#view.slide-l{animation:slideL .28s cubic-bezier(.2,.8,.2,1)}
#view.slide-r{animation:slideR .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideL{from{opacity:.2;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.2;transform:translateX(-36px)}to{opacity:1;transform:none}}
/* mode vacances / week-end */
.mc.adp{background:rgba(255,159,10,.16);color:#ff9f0a}
.adp-n{background:rgba(255,159,10,.09)!important}
.adp-n>b{color:#ff9f0a!important}
.arow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--sep);font-size:13.5px;line-height:1.35}
.arow:last-child{border-bottom:0}
.arow .ad{flex:none;width:52px;color:var(--t2);font-size:12px;font-weight:700;padding-top:1px}
.arow .ar{flex:1;min-width:0}
.mvto{margin-top:4px;color:#ff9f0a;font-size:13px}
.mvto b{color:#ff9f0a;font-weight:700}
.arow s{color:var(--t3);text-decoration-color:rgba(255,255,255,.3)}
.arow b{font-weight:650}
/* calendrier de période */
.cal{background:var(--card2);border-radius:20px;padding:12px 10px 10px}
.sheet .cal{background:var(--card3)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px}
.cal-h b{font-size:16px;text-transform:capitalize}
.cal-h .iconbtn{width:36px;height:36px;background:rgba(255,255,255,.07)}
.cal-h .iconbtn:disabled{opacity:.3}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cal-w{font-size:11px;color:var(--t3);text-align:center;padding:4px 0 6px;font-weight:700}
.cd{border:0;background:none;color:var(--t1);height:40px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;border-radius:0}
.cd span{display:grid;place-items:center;width:36px;height:36px;margin:auto;border-radius:50%}
.cd.in{background:rgba(255,255,255,.11)}
.cd.st{background:linear-gradient(90deg,transparent 50%,rgba(255,255,255,.11) 50%)}
.cd.en{background:linear-gradient(90deg,rgba(255,255,255,.11) 50%,transparent 50%)}
.cd.one{background:none}
.cd.st span,.cd.en span{background:var(--t1);color:#000}
.cd.td:not(.st):not(.en) span{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.cd.dis{opacity:.22;pointer-events:none}
.cd.we:not(.st):not(.en){color:var(--t2)}
.cal-s{margin:12px 0 10px;font-size:14px;color:var(--t2);min-height:20px}
.cal-s b{color:var(--t1)}
.cal-hint{display:inline-block;margin-left:8px;color:#ffd60a;font-size:12.5px;font-weight:600}
/* bloc événement */
.card.hero2.hero3{position:relative;display:block;overflow:hidden;padding:0;background:#0d1530;min-height:214px}
.h3-bg{position:absolute;left:0;right:0;top:0;bottom:0}
.h3-bg img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%);display:block}
.h3-shade{position:absolute;left:0;right:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(6,9,20,.82) 0%,rgba(6,9,20,.55) 55%,rgba(6,9,20,.30) 100%),linear-gradient(0deg,rgba(6,9,20,.55) 0%,rgba(6,9,20,0) 55%)}
.h3-in{position:relative;padding:20px 18px 18px;min-height:214px;display:flex;flex-direction:column;justify-content:center}
.h3-top{display:flex;align-items:flex-start;gap:14px}
.h3-top .h2l{flex:1;min-width:0}
.h3-loc{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:13px;color:rgba(255,255,255,.78);font-weight:600}
.hero3 .eyebrow{color:rgba(255,255,255,.72)}
.hero3 .ring{background:rgba(7,10,22,.35);border-radius:50%;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero3 .cd2 span{background:rgba(255,255,255,.12)}
.h3-d{display:flex;justify-content:space-between;gap:6px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.10);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.h3-d span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.h3-center{text-align:center;padding:30px 0 6px}
.herothumb{width:100%;height:120px;border-radius:16px;object-fit:cover;display:block;margin:0 0 12px}
.bgpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.bgpick button,.bgpick label{position:relative;display:block;height:78px;border:0;border-radius:14px;overflow:hidden;padding:0;background:var(--card3);color:#fff;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bgpick img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.bgpick span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11.5px;font-weight:700;text-align:center;background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,0))}
.bgpick .on{box-shadow:0 0 0 2.5px #fff}
.bgpick .plus{display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--t2)}
.credit{font-size:12px;color:var(--t3);line-height:1.45;margin:2px 0 0}
/* assistant Garmin */
.wzs{display:flex;gap:6px;justify-content:center;margin:0 0 16px}
.wzs i{width:30px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
.wzs i.d{background:#30d158}.wzs i.c{background:var(--t1)}
.wzbox{background:var(--card3);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:14px;line-height:1.5;color:var(--t2)}
.wzbox b{display:block;color:var(--t1);margin-bottom:2px;font-size:14.5px}
.wzl{margin:0 0 14px;padding:0;list-style:none;counter-reset:s}
.wzl li{counter-increment:s;display:flex;gap:11px;margin:0 0 11px;font-size:14.5px;line-height:1.45;color:#d3d2ca}
.wzl li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--card3);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--t1);margin-top:1px}
.wzl b{color:var(--t1)}
.wzok{text-align:center;padding:6px 0 12px}
.wzok .tick{width:68px;height:68px;border-radius:50%;background:rgba(48,209,88,.16);color:#30d158;display:grid;place-items:center;margin:0 auto 14px}
.wzok h3{margin:0 0 4px;font-size:22px}
.wzerr{color:#ff6b5e;font-size:14px;line-height:1.45;margin:0 0 12px}
.wzkey{width:100%;height:52px;border-radius:14px;border:0;background:var(--card3);color:var(--t1);font-size:15px;font-family:ui-monospace,Menlo,Consolas,monospace;padding:0 14px;margin:0 0 10px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;margin:0 0 10px}
a.btn.pri{color:#000}
/* accueil */
.wkcard{padding:16px 16px 14px}
.wkcard .wstrip{margin:0 0 14px}
.wkline{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;font-size:14.5px}
.wkline b{font-size:15px}
.wkline span{margin-left:auto;color:var(--t2);font-variant-numeric:tabular-nums}
.wkcard .bar{margin:0 0 12px}
.wktheme{margin:4px 0 0;padding-top:12px;border-top:1px solid var(--sep);font-size:13.5px;line-height:1.45;color:var(--t2)}
.wktheme b{color:var(--t1);font-weight:650}
.hline{color:var(--t2);font-size:14px;margin:-4px 2px 18px;line-height:1.4}
.hline b{color:var(--t1);font-weight:650}
.pgcard .dbig{margin-bottom:10px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 0}
.quick button{display:flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:14px;height:44px;background:var(--card2);color:var(--t1);font-size:14px;font-weight:650}
/* onglet Course */
.rhero .eyebrow{margin:0}
.rhero .big{font-size:58px}
.rhero .rsub{color:var(--t2);font-size:14px;margin:6px 8px 0;line-height:1.4}
.scn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 0}
.scn button{border:0;border-radius:16px;padding:11px 6px 10px;background:rgba(255,255,255,.07);color:var(--t1);display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:inset 0 0 0 1.5px transparent;transition:background .15s,box-shadow .15s}
.scn button span{font-size:12px;font-weight:700;color:var(--t2);letter-spacing:.02em}
.scn button b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.scn button[aria-pressed=true]{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1.5px var(--t1)}
.scn button[aria-pressed=true] span{color:var(--t1)}
.rmeta{margin:14px 4px 0;font-size:13.5px;line-height:1.55;color:var(--t2)}
.rmeta b{color:var(--t1)}
.rmeta .warn{color:#ff6b5e}
.rline small b{color:var(--t1);font-weight:650}
.basis{font-size:13px;line-height:1.5;color:var(--t2);margin:0 0 10px}
.basis b{color:var(--t1)}
/* onglet Données */
.dsum .dbig{font-size:36px;font-weight:800;letter-spacing:-.03em;margin:6px 0 12px;font-variant-numeric:tabular-nums;line-height:1.05}
.dsum .dbig small{font-size:15px;font-weight:600;color:var(--t2);letter-spacing:0;margin-left:6px}
.dsum .kpis{margin:14px 0 0}
.dsum .kpi{background:rgba(255,255,255,.06)}
.fpill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px;background:var(--fb);color:var(--fc)}
.fpill i{width:9px;height:9px;border-radius:50%;background:var(--fc)}
.band{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14.5px}
.band i{width:12px;height:12px;border-radius:4px;flex:none}
.band small{display:block;color:var(--t2);font-size:12.5px}
.band>b{margin-left:auto;font-size:15px;font-variant-numeric:tabular-nums}
.dnote{background:rgba(255,255,255,.06);border-radius:14px;padding:11px 13px;font-size:13.5px;line-height:1.5;margin:14px 0 0;color:var(--t2)}
.dnote b{color:var(--t1)}
.dtitle{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.dtitle h2{margin:0;flex:1}
.dsub{color:var(--t2);font-size:13.5px;margin:0 0 12px;line-height:1.4}
details.mf{margin-top:12px;border-top:1px solid var(--sep);padding-top:10px}
details.mf>summary{cursor:pointer;color:var(--t2);font-weight:650;font-size:14px;list-style:none;display:flex;align-items:center;gap:6px}
details.mf>summary::-webkit-details-marker{display:none}
details.mf>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--t3);border-bottom:2px solid var(--t3);transform:rotate(45deg);transition:transform .2s}
details.mf[open]>summary::after{transform:rotate(-135deg)}
details.mf>div{padding-top:10px}
details.mf .card{background:var(--card2);box-shadow:none}
/* écran d'entrée */
.gate{margin:calc(-10px - var(--sat)) -16px -20px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#000}
.g-body{position:relative;margin-top:-62px;padding:0 22px calc(26px + var(--sab));display:flex;flex-direction:column;align-items:center;text-align:center;flex:1}
.g-t{font-size:31px;line-height:1.12;font-weight:800;letter-spacing:-.035em;margin:18px 0 10px}
/* Page d'accueil des visiteurs (unslop) : grille de 4 px, trois rôles de texte, le vert de la marque en accent seulement */
.land{background:var(--bg)}
.ld-band{position:relative;height:clamp(192px,28vh,256px);flex:none;background:var(--hero) 50% 42%/cover no-repeat}
.ld-band::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,.32) 0%,rgba(11,11,12,0) 40%,var(--bg) 100%)}
.ld-in{position:relative;flex:1;margin-top:-64px;padding:0 20px calc(32px + var(--sab));display:flex;flex-direction:column;align-items:center}
.ld-main{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}
.ld-copy{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.ld-brand{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 4px 20px rgba(0,0,0,.6))}
.ld-word{font-family:var(--title);font-style:italic;font-weight:800;font-size:56px;line-height:.9;letter-spacing:.01em;color:var(--t1)}
.ld-word i{font-style:inherit;color:var(--brand)}
.ld-wave{width:148px;height:12px;margin-top:8px;fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round}
.ld-t{margin:28px 0 12px;font-family:var(--title);font-style:italic;font-weight:800;font-size:40px;line-height:1.02;letter-spacing:0;text-transform:uppercase;color:var(--t1)}
.ld-nw{white-space:nowrap}
.ld-s{margin:0 0 24px;max-width:34em;font-size:16px;line-height:24px;color:var(--t2)}
.ld-cta{width:100%;max-width:340px;display:flex;flex-direction:column}   /* largeur du bouton Google */
.ld-go{height:52px;margin:0;font-size:17px}
.ld-fine{margin:12px 0 0;font-size:13px;line-height:20px;color:var(--t3)}
.ld-or{display:flex;align-items:center;gap:12px;margin:20px 0 12px;font-size:13px;color:var(--t3)}
.ld-or::before,.ld-or::after{content:'';flex:1;height:1px;background:var(--brd)}
.ld-show{width:100%;margin:32px 0 0}
.ld-photo{display:none}
.ld-demo{padding:0 16px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--brd);text-align:left}
.ld-dh{display:flex;align-items:baseline;gap:8px;padding:16px 0 12px;font-size:13px;color:var(--t2)}
.ld-dh b{font-size:15px;font-weight:600;color:var(--t1)}
.ld-dh em{margin-left:auto;font-style:normal;font-size:12px;color:var(--t3)}
.ld-dr{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--brd)}
.ld-di{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--cb);color:var(--c)}
.ld-dt{flex:1;min-width:0}
.ld-dt small{display:block;font-size:12px;line-height:16px;color:var(--t3)}
.ld-dt b{display:block;font-size:15px;line-height:20px;font-weight:500;color:var(--t1)}
.ld-dt small:last-child{color:var(--t2);font-variant-numeric:tabular-nums}
.ld-st{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--t3);white-space:nowrap}
.ld-st.ok{color:var(--brand);font-weight:500}
.ld-ok{width:20px;height:8px;fill:none;stroke:var(--brand);stroke-width:3;stroke-linecap:round}
.ld-dn{margin:0;padding:12px 0 16px;border-top:1px solid var(--brd);font-size:13px;line-height:20px;color:var(--t2)}
.ld-feat{width:100%;max-width:400px;margin:32px 0 0;padding:0;list-style:none;text-align:left}
.ld-feat li{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--brd)}
.ld-feat li:first-child{border-top:0;padding-top:0}
.ld-fi{flex:none;width:20px;padding-top:2px;color:var(--t3)}
.ld-feat b{display:block;font-size:15px;line-height:20px;font-weight:500;color:var(--t1)}
.ld-feat p{margin:4px 0 0;font-size:14px;line-height:20px;color:var(--t2)}
.ld-end{width:100%;max-width:400px;margin:24px 0 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.ld-end .ld-go{width:100%}
.ld-end .lnk{margin:0;color:var(--t3)}
@media (max-height:700px){.ld-band{height:176px}.ld-word{font-size:48px}.ld-t{font-size:36px}}
/* Ordinateur : texte et bouton à gauche, la photo (760 px, trop petite pour toute la largeur) à droite, la semaine type par-dessus */
@media (min-width:960px){
  body.gating #view{max-width:none;padding-left:0;padding-right:0}
  .gate.land{margin-left:0;margin-right:0}
  .ld-band{display:none}
  .ld-in{margin-top:0;padding:96px 48px 64px}
  .ld-main{max-width:1120px;flex-direction:row;align-items:center;gap:64px}
  .ld-copy{flex:1 1 0;align-items:flex-start;text-align:left}
  .ld-brand{align-items:flex-start;filter:none}
  .ld-t{margin-top:40px;font-size:64px}
  .ld-s{max-width:30em;font-size:18px;line-height:28px}
  .ld-show{flex:1 1 0;position:relative;margin:0;padding:0 0 128px}
  .ld-photo{display:block;aspect-ratio:760/543;border-radius:20px;background:var(--hero) 50% 50%/cover no-repeat;box-shadow:inset 0 0 0 1px var(--brd)}
  .ld-demo{position:absolute;left:-48px;bottom:0;width:384px;box-shadow:inset 0 0 0 1px var(--brd),0 24px 48px rgba(0,0,0,.5)}
  .ld-feat{max-width:1120px;margin:96px 0 0;padding:32px 0 0;border-top:1px solid var(--brd);display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
  .ld-feat li,.ld-feat li:first-child{padding:0;border-top:0}
  .ld-end{max-width:1120px;margin:64px 0 0;flex-direction:row;justify-content:space-between}
  .ld-end .ld-go{width:auto;padding:0 32px}
}
.g-cta{width:100%;max-width:380px;margin:4px 0 22px;padding:16px 16px 12px;border-radius:24px;background:linear-gradient(160deg,rgba(215,255,58,.13),rgba(215,255,58,.04));box-shadow:inset 0 0 0 1.5px rgba(215,255,58,.55),0 14px 40px rgba(215,255,58,.08)}
.g-ctal{margin:0 0 12px;font-family:var(--title);font-style:italic;font-weight:800;font-size:21px;text-transform:uppercase;color:var(--brand)}
.g-cta .g-fine{margin:10px 0 0}
.g-gbox{display:flex;justify-content:center;align-items:center;min-height:52px;border-radius:999px;color-scheme:light}
.g-gbox.w{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
#g-btn{color-scheme:light;background:transparent}
#g-btn iframe{color-scheme:light;border-radius:999px}
.g-wait{color:var(--t2);font-size:14px;animation:gpulse 1.4s ease-in-out infinite}
@keyframes gpulse{0%,100%{opacity:.45}50%{opacity:1}}
.g-fine{color:var(--t3);font-size:12.5px;line-height:1.7;margin:2px 0 0}
.g-fine .lnk{margin:0;color:var(--t2);padding:2px 0}
@media (max-height:700px){.g-t{font-size:27px}}
@media (prefers-reduced-motion:reduce){.g-wait{animation:none}}
/* choix de la course */
body.setup .tabbar{display:none}
body.setup #view{padding-bottom:40px}
.fmtgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fmtc{display:block;text-align:left;border:0;border-radius:16px;padding:12px 13px;background:var(--card2);color:var(--t1);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s,background .15s}
.fmtc b{display:block;font-size:15px;font-weight:700}
.fmtc small{display:block;margin-top:3px;color:var(--t2);font-size:12px;line-height:1.35;font-variant-numeric:tabular-nums}
.fmtc[aria-pressed=true]{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1.5px var(--t1)}
.sheet .fmtc{background:var(--card3)}
.stp{display:flex;align-items:center;gap:14px}
.stp b{font-size:22px;font-weight:800;min-width:92px;text-align:center;font-variant-numeric:tabular-nums}
.stp .iconbtn{width:44px;height:44px;font-size:22px;font-weight:700;color:var(--t1)}
.rsec{margin:0 0 20px}
.rsec>.eyebrow{margin:0 0 8px}
.rsum{border-radius:18px;padding:14px 16px;background:linear-gradient(160deg,rgba(80,110,200,.18),rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);font-size:14px;line-height:1.5}
.rsum b{color:var(--t1)}
.rsum .rw{color:#ffd60a;margin-top:6px;font-size:13px}
.rsum .re{color:#ff6b5e;margin-top:6px;font-size:13px}
.tinp{width:100%;height:48px;border-radius:14px;border:0;background:var(--card2);color:var(--t1);font-size:16px;font-family:inherit;padding:0 14px}
.sheet .tinp{background:var(--card3)}
/* recherche de course */
.rres{margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.rr{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;padding:11px 13px;background:var(--card2);color:var(--t1);text-align:left}
.sheet .rr{background:var(--card3)}
.rr .t{flex:1;min-width:0}
.rr b{display:block;font-size:14.5px;font-weight:650;line-height:1.3}
.rr small{display:block;color:var(--t2);font-size:12.5px;margin-top:2px;line-height:1.35}
.rr .tag{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--t2);white-space:nowrap}
.rr .tag.wt{background:rgba(57,135,229,.2);color:#6aa8f0}
.rhint{font-size:12.5px;color:#ffd60a;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){#view.slide-l,#view.slide-r{animation:none}.skel i{animation:none}#view.enter>*{animation:none}html{scroll-behavior:auto}}
/* ---------- Charte Triient (voir marque/charte.png) ----------
   Vert #D7FF3A, noir #0B0B0C, blanc #FFFFFF. Titres : Barlow Condensed ExtraBold Italic en majuscules ; textes : Barlow.
   Le vert sert d'accent (bouton principal, élément actif) ; les couleurs des sports restent celles de l'app. */
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700 800;font-display:swap;src:url(fonts/barlow-700.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-800-italic.woff2) format('woff2')}
:root{--bg:#0B0B0C;--brand:#D7FF3A;--ink:#0B0B0C;--t1:#FFFFFF;--acc:#D7FF3A;--title:'Barlow Condensed','Arial Narrow',sans-serif}
html,.gate{background:var(--bg)}
body{font-family:'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:500}
h1,.g-t,.hero .big,.hero2 .big,.rhero .big,.tot b{font-family:var(--title);font-style:italic;font-weight:800;letter-spacing:0;text-transform:uppercase}
h1{font-size:38px;line-height:1}
.g-t{font-size:38px;line-height:1.02}
.g-slogan{margin:10px 0 0;font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--t2)}
.g-t{margin-top:22px}
.fmtc[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--brand)}
.gtip{padding:14px 16px}
.gtip .gi{width:34px;height:34px;border-radius:10px;background:rgba(215,255,58,.14);color:var(--brand);display:grid;place-items:center;flex:none}
.gtip b{font-size:14.5px}
.fstep{display:flex;align-items:center;gap:8px}
/* Formulaire « Ta course » (unslop) : étiquettes en minuscules, grille de 4 px, surfaces neutres ; le vert pour la sélection,
   le bouton principal et les étapes remplies */
.rform .eyebrow{font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--t2)}
.rform .top .eyebrow{font-size:14px}
.rform .rsec{margin:0 0 32px}
.rform .rsec>.eyebrow{margin:0 0 12px}
.rform .fstep{gap:12px;font-size:16px;font-weight:600;color:var(--t1)}
.rform .fstep i{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--card2);box-shadow:inset 0 0 0 1px var(--brd);color:var(--t2);font-style:normal;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.rform .fstep i.ok{background:var(--brand);box-shadow:none;color:var(--ink)}
.rform .tinp{height:48px;border-radius:12px;padding:0 16px}
.rform .rres{margin:8px 0 0;gap:4px}
.rform .rr{padding:12px 16px;border-radius:12px;gap:12px}
.rform .rr b{font-weight:600}
.rform .rr .tag,.rform .rr .tag.wt{padding:0;border-radius:0;background:none;color:var(--t3);font-size:12px;font-weight:500}
.rform .fmtc{padding:12px 16px;border-radius:12px}
.rform .fmtc b{font-weight:600}
.rform .fmtc small{margin-top:4px}
.rform .rng{gap:8px}
.rform .rng button{height:36px;padding:0 16px;border-radius:10px;font-size:13px;font-weight:500}
.rform .rhint{display:flex;gap:8px;align-items:flex-start;color:var(--t2);font-size:13px;line-height:20px}
.rform .rhint .ic{flex:none;margin-top:2px;color:var(--t3)}
.rform .fcard{padding:16px;border-radius:16px}
.rform .fcard .eyebrow{margin:0 0 8px}
.rform .stp{gap:12px}
.rform .stp b{min-width:88px;font-size:24px;font-weight:600}

        (v[2]>0?[bikeMid(rw,kind,ph,v[2])]:[]).concat(v[9]>0?[ex(runEasy(rw,kind,ph,v[9]),9)]:[],v[15]>0?[ex(swimC(rw,kind,ph,v[15]),15)]:[]),
        (v[3]>0?[runMid(rw,kind,ph,v[3])]:[]).concat(v[8]>0?[ex(swimC(rw,kind,ph,v[8]),8)]:[],v[11]>0?[ex(strengthB(rw,kind,ph,v[11]),11)]:[],v[17]>0?[ex(bikeEasy(rw,kind,ph,v[17]),17)]:[]),

        (v[4]>0?[bikeLong(rw,kind,ph,v[4])]:[]).concat(v[5]>0?[brick(rw,kind,ph,v[5])]:[]),
        (v[6]>0?[runLong(rw,kind,ph,v[6])]:[]).concat(v[16]>0?[ex(swimC(rw,kind,ph,v[16]),16)]:[])
      ];
      days.forEach(function(l,di){if(!l.length){var rs=restDay(w);rs.fr=1;days[di]=[rs];}});     // jour sans séance : repos (disponible pour recevoir une séance déplacée)
    }

    for(d=0;d<7;d++){

  for(g=t-1;g>=Math.max(0,t-MISS_DAYS);g--){if(g<(NW-1)*7)gday(g).forEach(function(x){if(isMissed(x)&&!rec[x.id])out.push(x);});}
  return out;
}
// Le jour le plus adapté dans les 7 prochains : ni repos prévu, ni même discipline le même jour, ni journée déjà chargée, ni autour d'une longue séance ou d'une course
function missTarget(m,sp){
  var t=idxOfDate(today()),N=(NW-1)*7,block={},best=null,bc=1e9,g;
  stepList().forEach(function(x){if(stepInPlan(x)){var c=idxOfDate(parseYmd(x.date));block[c-1]=block[c]=block[c+1]=1;}});
  var isLong=function(i){return i>=0&&i<N&&gday(i).some(function(x){return x.sp!=='rest'&&x.min>=120;});};
  for(g=Math.max(0,t);g<=Math.min(N-1,t+6);g++){
    var wk=PLAN[Math.floor(g/7)];
    if(wk.kind==='taper'||wk.kind==='race'||block[g]||isLong(g-1)||isLong(g+1))continue;
    if(wk.layout[g%7].every(function(x){return (x.orig||x).sp==='rest'&&!(x.orig||x).fr;}))continue;
    var l=0,same=false;gday(g).forEach(function(x){if(x.sp!=='rest'){l+=x.min;if(x.sp===sp)same=true;}});
    if(same||l+m>MISS_MAX_DAY)continue;
    var c2=l+(g-t)*10;
    if(c2<bc){bc=c2;best=g;}
  }
  return best;
}
function missAdvice(s){
  var src=awaySrc(s),kind=PLAN[src.w-1].kind,nf=(src.sp==='brick'||src.sp==='str')?null:stepAdapt(src,'light'),isShort=!!nf&&nf.sp!=='rest'&&nf.min<src.min;
  var canMove=src.sp!=='brick'&&kind!=='taper',o={move:canMove?missTarget(src.min,src.sp):null,short:canMove&&isShort?missTarget(nf.min,src.sp):null,shortMin:isShort?nf.min:0};
  if(src.sp==='brick'||src.sp==='str'||src.min<=30||kind==='rec'||kind==='taper'){o.rec='skip';o.why='Ne la rattrape pas : elle ne manquera pas à ta préparation. Passe à la suite.';}
  else if(src.min>=90&&o.short!==null){o.rec='short';o.why='Séance importante, mais trop longue pour s’ajouter telle quelle à ta semaine : fais-en une version plus courte.';}
  else if(o.move!==null){o.rec='move';o.why='Elle trouve sa place cette semaine sans te surcharger.';}
  else if(o.short!==null){o.rec='short';o.why='Telle quelle, elle chargerait trop ta semaine : fais-en une version plus courte.';}
  else{o.rec='skip';o.why='Ta semaine est déjà bien remplie : mieux vaut passer à la suite que tout rattraper.';}
  return o;
}
function missDay(g){var d=addDays(PLAN_START,g);return DAYS[(d.getDay()+6)%7].slice(0,3).toLowerCase()+'. '+fmtDay(d);}
function missButtons(s){
  var o=missAdvice(s),b=[];
  var btn=function(k,t){return '<button class="btn'+(o.rec===k?' pri':'')+'" data-act="missdo" data-id="'+s.id+'" data-a="'+k+'">'+t+'</button>';};
  if(o.short!==null)b.push(['short',btn('short','Version courte ('+fh(o.shortMin)+') '+missDay(o.short))]);
  if(o.move!==null)b.push(['move',btn('move','Reporter au '+missDay(o.move))]);
  b.push(['skip',btn('skip','Laisser tomber')]);

}
function missCard(){

function missDo(id,a){

function missUndo(id){

function missAll(){

function applyMissed(){
  var rec=missRec(),N=(NW-1)*7;
  Object.keys(rec).forEach(function(id){
    var r=rec[id],x=SBY[id],pos=ORIGPOS[id],d=r.to&&parseYmd(r.to);if(!x||!pos||!d)return;
    var g=idxOfDate(d);if(g<0||g>=N)return;
    if(r.a==='short'){
      var src=awaySrc(x),nf=stepAdapt(src,'light');
      if(nf){var snap=x.orig||copySess(x),w=x.w,dd=x.d;Object.keys(x).forEach(function(k){delete x[k];});Object.assign(x,nf,{id:id,w:w,d:dd,orig:snap,adapt:{mode:'light',label:'Séance manquée',pid:'miss'}});}
    }
    moveSess(x,g,(pos.w-1)*7+pos.d,{id:'miss',label:'Séance manquée'});
  });
}
// skip : identifiant d'une période à ignorer (aperçu en cours de modification) ; skipStep : pareil pour une course intermédiaire
function applyAway(skip,skipStep){
  PLAN.forEach(function(wk){if(!wk.layout){wk.layout=wk.days.map(function(day){return day.sessions.slice();});wk.layout.forEach(function(l,i){l.forEach(function(s){ORIGPOS[s.id]={w:wk.n,d:i};});});}});
  ALLS.forEach(function(s){
    if(!s.orig)return;
    var o=s.orig;Object.keys(s).forEach(function(k){delete s[k];});Object.assign(s,o);
  });
  PLAN.forEach(function(wk){wk.days.forEach(function(day,i){day.sessions=wk.layout[i].slice();day.sessions.forEach(function(s){s.w=wk.n;s.d=i;delete s.moved;});});});
  awayList().forEach(function(p){
    if(p.id===skip)return;
    var ops=planAway(p);if(!ops)return;
    ops.forEach(function(op){
      var s=op.s;
      if(op.nf){
        var snap=s.orig||copySess(s),id=snap.id,w=s.w,d=s.d;
        Object.keys(s).forEach(function(k){delete s[k];});
        Object.assign(s,op.nf,{id:id,w:w,d:d,orig:snap,adapt:{mode:p.mode,label:p.label,pid:p.id}});
      }
      if(op.to!==null){var pos=ORIGPOS[s.id];moveSess(s,op.to,(pos.w-1)*7+pos.d,p);}
    });
  });
  applyMissed();
  applySteps(skipStep);
  PLAN.forEach(function(wk){
    wk.min=0;wk.m=0;wk.count=0;
    wk.days.forEach(function(day){day.sessions.forEach(function(s){if(s.sp!=='rest'){wk.count++;wk.min+=s.min;wk.m+=s.m;}});});
  });
}
function newAwayDraft(wn,type){
  var mon=PLAN[Math.max(0,Math.min(NW-1,wn-1))].start,vac=type==='vacances';
  if(type==='injury'){   // blessure : à partir d'aujourd'hui (ou du début du plan), tout arrêté, jusqu'à nouvel ordre
    var t0=today(),f0=t0<PLAN_START?PLAN_START:t0>RACE_DATE?mon:t0;
    return {id:'',type:'injury',label:'Blessure',from:isoDate(f0),to:isoDate(addDays(f0,13)),open:true,stop:{swim:true,bike:true,run:true,str:true},mode:'same',move:'none',pool:true,bike:true};
  }
  return {id:'',type:type,label:vac?'Vacances':'Week-end',from:isoDate(vac?mon:addDays(mon,4)),to:isoDate(addDays(mon,6)),mode:vac?'min':'same',move:vac?'none':'out',pool:true,bike:true};
}
/* ---------- Choisir sa course (premier lancement ou changement de course) ---------- */
/* ---------- Sauvegarde cloud chiffrée (sans compte) ----------
   Un « code de récupération » (130 bits, généré ici, jamais envoyé) donne : une adresse (id), une preuve d'écriture (wk) et une clé AES-GCM.
   Le serveur ne stocke qu'un blob chiffré : il ne peut ni lire tes séances ni t'identifier. Perdre le code = perdre la sauvegarde cloud
   (les données restent sur l'appareil). La clé intervals.icu n'est JAMAIS sauvegardée. */
var B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function newCode(){
  var b=new Uint8Array(17),i,bits='',out='';crypto.getRandomValues(b);
  for(i=0;i<b.length;i++)bits+=('00000000'+b[i].toString(2)).slice(-8);
  for(i=0;i+5<=130;i+=5)out+=B32[parseInt(bits.slice(i,i+5),2)];
  return out;
}
function normCode(c){return String(c||'').toUpperCase().replace(/O/g,'0').replace(/[IL]/g,'1').replace(/[^0-9A-Z]/g,'').replace(/U/g,'V');}
function fmtCode(c){return c.replace(/(.{5})/g,'$1-').replace(/-$/,'');}
function validCode(c){return c.length===26&&c.split('').every(function(x){return B32.indexOf(x)>=0;});}
function hexOf(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
function sha(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));}
function b64(buf){var s='',a=new Uint8Array(buf),i;for(i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function cloudKeys(code){
  return Promise.all([sha('id:'+code),sha('w:'+code),sha('enc:'+code)]).then(function(r){
    return crypto.subtle.importKey('raw',r[2],{name:'AES-GCM'},false,['encrypt','decrypt']).then(function(k){return {id:hexOf(r[0]),wk:hexOf(r[1]),key:k};});
  });
}
function cloudBase(){return (state.ui&&state.ui.pubApi)||PUB_API;}
// acc : envoi vers le compte Google, qui garde aussi la connexion Garmin (clé chiffrée par le serveur). Jamais dans la sauvegarde par code.
function cloudPayload(acc){
  var u=state.ui||{},sv=state.sv||{};
  var p={app:'triient',v:1,done:state.done,links:state.links,race:state.race||(SETUP?null:CFG),prof:u.prof||{},lv:u.lvl||{},st:u.steps||[],ms:u.missed||{},away:u.away||[],rc:u.race||{}};
  if(acc){if(sv.key){p.gk=sv.key;if(sv.url&&sv.url!==PUB_API)p.gu=sv.url;}else if(u.gkOff)p.gkx=1;}
  return p;
}
function cloudEncrypt(keys,obj){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},keys.key,new TextEncoder().encode(JSON.stringify(obj))).then(function(ct){
    var all=new Uint8Array(12+ct.byteLength);all.set(iv,0);all.set(new Uint8Array(ct),12);return b64(all);
  });
}
function cloudDecrypt(keys,blob){
  var a=unb64(blob);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},keys.key,a.slice(12)).then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});
}
function cloudCall(keys,method,body){
  var o={method:method,headers:{'Content-Type':'application/json','X-Sync-Write':keys.wk}};if(body)o.body=JSON.stringify(body);
  return fetch(cloudBase()+'/pub/sync/'+keys.id,o).then(function(r){return r.json().then(function(j){j.status=r.status;return j;});});
}
var cloudTimer=null,cloudBusy=false,cloudDraftCode=null;
function cloudCfg(){return state.ui&&state.ui.cloud;}
function save0(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function cloudSchedule(){
  if(DEV)return;
  if(acct()){acctSchedule();return;}
  if(!cloudCfg()||cloudCfg().paused)return;
  clearTimeout(cloudTimer);cloudTimer=setTimeout(function(){cloudPush(false);},20000);
}
// envoi : seulement si les données ont changé depuis la dernière sauvegarde
function cloudPush(loud){
  if(DEV)return Promise.resolve();
  var c=cloudCfg();if(!c||cloudBusy)return Promise.resolve();
  var payload=cloudPayload(),sig=JSON.stringify(payload);
  if(!loud&&sig===c.sig)return Promise.resolve();
  cloudBusy=true;
  return cloudKeys(c.code).then(function(keys){
    return cloudEncrypt(keys,payload).then(function(blob){return cloudCall(keys,'PUT',{blob:blob,base:c.v||0});});
  }).then(function(j){
    if(j.status===409){c.conflict=true;c.paused=true;save0();if(loud)toast('Une version plus récente existe dans le cloud');return;}
    if(!j.ok)throw new Error(j.error||('Erreur '+j.status));
    c.v=j.v;c.t=j.updated||Date.now();c.sig=sig;c.err='';c.conflict=false;save0();
    if(loud)toast('Sauvegarde cloud effectuée');
  }).catch(function(e){c.err=(e&&e.message)==='Failed to fetch'?'Hors ligne':String((e&&e.message)||e);save0();if(loud)toast('Sauvegarde cloud impossible : '+c.err);})
  .then(function(){cloudBusy=false;});
}
function cloudApply(p){
  state.done=p.done||{};state.links=p.links||{};
  state.ui.prof=p.prof||{};state.ui.lvl=p.lv||{};state.ui.steps=p.st||[];state.ui.missed=p.ms||{};state.ui.away=p.away||[];state.ui.race=p.rc||{};
  if(p.race&&p.race.date&&p.race.start)state.race=p.race;
  if(p.gk&&p.gk!==(state.sv&&state.sv.key)){state.sv={url:p.gu||PUB_API,key:p.gk};delete state.ui.gkOff;}   // connexion Garmin gardée dans le compte
}
// récupération (nouvel appareil ou restauration) : télécharge, déchiffre et remplace les données locales
function cloudRestore(codeRaw,silent){
  var code=normCode(codeRaw);
  if(!validCode(code)){toast('Code invalide : 26 caractères attendus');return;}
  toast('Récupération…');
  cloudKeys(code).then(function(keys){
    return fetch(cloudBase()+'/pub/sync/'+keys.id).then(function(r){return r.json().then(function(j){j.status=r.status;return j;});}).then(function(j){
      if(j.status===404){toast('Aucune sauvegarde pour ce code');return;}
      if(!j.ok||!j.blob)throw new Error(j.error||'Erreur');
      return cloudDecrypt(keys,j.blob).then(function(p){
        if(!silent&&!confirm('Remplacer les données de cet appareil par la sauvegarde cloud ?'))return;
        cloudApply(p);
        state.ui.cloud={code:code,v:j.v,t:j.updated,sig:JSON.stringify(cloudPayload()),err:'',paused:false};
        track('cloud_restore','');
        save0();location.reload();
      });
    });
  }).catch(function(e){toast((e&&e.name==='OperationError')?'Code incorrect':('Échec : '+((e&&e.message)||e)));});
}
function cloudEnable(){
  var code=cloudDraftCode;if(!code)return;
  cloudKeys(code).then(function(keys){
    return cloudEncrypt(keys,cloudPayload()).then(function(blob){return cloudCall(keys,'PUT',{blob:blob,base:0});});
  }).then(function(j){
    if(!j.ok)throw new Error(j.error||('Erreur '+j.status));
    state.ui.cloud={code:code,v:j.v,t:j.updated,sig:JSON.stringify(cloudPayload()),err:'',paused:false};save0();cloudDraftCode=null;
    track('cloud_enabled','');toast('Sauvegarde cloud activée');openSheet();
  }).catch(function(e){toast('Activation impossible : '+(((e&&e.message)==='Failed to fetch')?'serveur injoignable':((e&&e.message)||e)));});
}
// « Sauvegarder maintenant » (après un conflit : on repart de la version du cloud pour l'écraser sciemment)
function cloudForce(){
  var c=cloudCfg();if(!c)return;
  cloudKeys(c.code).then(function(keys){
    return fetch(cloudBase()+'/pub/sync/'+keys.id+'?meta=1').then(function(r){return r.json();}).then(function(m){if(m&&m.ok)c.v=m.v;return cloudPush(true);});
  }).then(function(){openSheet();});
}
// au démarrage : une version plus récente dans le cloud (autre appareil) ?
function cloudBoot(){
  var c=cloudCfg();if(!c)return;
  cloudKeys(c.code).then(function(keys){return fetch(cloudBase()+'/pub/sync/'+keys.id+'?meta=1').then(function(r){return r.json();});}).then(function(m){
    if(!m||!m.ok)return;
    if(m.v>(c.v||0)){
      c.conflict=true;c.paused=true;save0();
      if(JSON.stringify(cloudPayload())===c.sig)cloudRestore(c.code,true);   // rien de modifié ici : on charge simplement la version plus récente
      else toast('Une version plus récente existe dans le cloud (Réglages → Sauvegarde cloud)');
    }else if(JSON.stringify(cloudPayload())!==c.sig)cloudSchedule();
  }).catch(function(){});
}

/* ---------- Compte (connexion Google) ----------
   Après « Continuer avec Google », le serveur vérifie l'identité et renvoie une session (90 jours). Le plan, les séances cochées et les
   réglages sont enregistrés dans le compte (lisibles par le service, contrairement à la sauvegarde par code). La clé intervals.icu y est aussi,
   chiffrée par le serveur : se connecter sur un autre appareil (ou une autre adresse de l'app) suffit pour retrouver Garmin. */
/* Connexion obligatoire : tant qu'il n'est pas connecté, l'utilisateur ne voit qu'un écran « Crée ton compte ».
   Garde-fous : jamais en ouverture de fichier (file://, la connexion Google y est impossible) ; si le serveur n'a pas de connexion Google configurée,
   l'app reste ouverte ; un utilisateur déjà connecté n'est jamais bloqué, même hors ligne (la session est locale). */
var LOGIN_REQUIRED=true,gateShown=false,gateTracked=false;
/* ---------- Assistant de connexion Garmin (via intervals.icu) ----------
   Garmin n'ouvre pas son API aux petites applications : intervals.icu (gratuit) fait le lien. L'assistant guide en 3 étapes, valide la clé
   immédiatement (nom du compte, nombre d'activités) et explique quoi faire quand rien n'arrive. Plus tard, l'étape 3 pourra devenir un bouton
   « Se connecter avec intervals.icu » (OAuth) sans changer le reste. */
var wz={step:1,key:'',busy:false,err:'',res:null};
function openWiz(step){wz={step:step||1,key:'',busy:false,err:'',res:null};trackOnce('wiz_start','u');renderWiz();}   // « u » : une fois par appareil (avant : à chaque ouverture)
function renderWiz(){
  var s=wz.step,h='',dots='<div class="wzs" aria-hidden="true">'+[1,2,3].map(function(i){return '<i class="'+(wz.res?'d':i<s?'d':i===s?'c':'')+'"></i>';}).join('')+'</div>';
  if(wz.res){
    var r=wz.res;
    if(r.count>0){

function wzVerify(){
  var key=(wz.key||'').trim().replace(/\s+/g,''),base=cloudBase(),H={'X-Icu-Key':key};

  wz.busy=true;renderWiz();
  fetch(base+'/api/status',{headers:H}).then(function(r){return r.json().then(function(j){j.status=r.status;return j;});}).then(function(j){
    if(j.status===401||j.connected===false)throw new Error(/refuse/.test(j.error||'')||j.status===401?'intervals.icu refuse cette clé. Vérifie que tu l’as copiée en entier.':(j.error||'Connexion refusée'));

      wz.res={ok:true,name:j.athlete||'',count:acts.length,last:acts[0]||null};

  }).catch(function(e){
    var m=(e&&e.message)||'';wz.err=(m==='Failed to fetch'||m==='Load failed')?'Serveur injoignable. Vérifie ta connexion et réessaie.':m||'Échec de la connexion';track('wiz_error','');
  }).then(function(){wz.busy=false;renderWiz();});
}

function acctCall(method,path,body){

function devInfo(){

  try{inst=navigator.standalone===true||!!(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);}catch(e){}

  var br=/FBAN|FBAV|FB_IAB|Instagram|Snapchat|TikTok|LinkedInApp/.test(ua)?'appli tierce':/SamsungBrowser/.test(ua)?'Samsung Internet':/EdgA?\/|EdgiOS/.test(ua)?'Edge':/OPR\/|OPiOS/.test(ua)?'Opera':/CriOS|Chrome\//.test(ua)?'Chrome':/FxiOS|Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'navigateur';
  return {dev:os+' · '+(inst?'app installée':br),inst:inst?1:0};

var pingTimer=null,pingSig='',pingT=0;

function acctPing(){
  var a=acct();if(!a)return;
  var t=SETUP?null:stats().t,b=t?{done:t.d,total:t.n}:{};
  if(statsOn()){var di=devInfo(),sv=state.sv||{};b.dev=di.dev;b.inst=di.inst;b.g=sv.url&&sv.key?1:0;b.sent=Object.keys(state.ui.sent||{}).length;b.acts=(sv.acts||[]).length;}
  var sig=JSON.stringify(b);
  if(sig===pingSig&&Date.now()-pingT<12e5)return;
  pingSig=sig;pingT=Date.now();
  acctCall('POST','/pub/account/ping',b).then(function(j){
    var x=acct();
    if(!j||!j.ok)pingSig='';
    if(j&&j.ok&&j.admin&&!state.ui.own){state.ui.own=1;save0();}   // appareil du propriétaire : exclu des compteurs anonymes, même déconnecté
    if(x&&j&&j.ok&&!!x.admin!==!!j.admin){x.admin=!!j.admin;save0();safeRender();}
  }).catch(function(){pingSig='';});
}
function acctPush(loud){
  if(DEV)return Promise.resolve();
  var a=acct();if(!a||acctBusy)return Promise.resolve();
  var payload=cloudPayload(true),sig=JSON.stringify(payload);
  if(!loud&&sig===a.sig)return Promise.resolve();
  acctBusy=true;
  return acctCall('PUT','/pub/account/data',{data:payload,base:a.v||0}).then(function(j){
    if(j.status===409){a.conflict=true;a.paused=true;save0();if(loud)toast('Une version plus récente existe dans ton compte');return;}
    if(!j.ok)throw new Error(j.error||('Erreur '+j.status));
    a.v=j.v;a.t=j.updated||Date.now();a.sig=sig;a.err='';a.conflict=false;save0();
    if(loud)toast('Compte à jour');
  }).catch(function(e){var x=acct();if(!x)return;x.err=(e&&e.message)==='Failed to fetch'?'Hors ligne':String((e&&e.message)||e);save0();if(loud)toast('Synchronisation impossible : '+x.err);})
  .then(function(){acctBusy=false;});

function acctAfterLogin(){

    var a=acct();if(!a)return;
    if(!j.ok)throw new Error(j.error||'Erreur');
    a.v=j.v;

    if(j.data&&j.data.done){
      var nm=(j.data.race&&j.data.race.name)||'ton plan';
      if(pend?confirm('Un plan existe déjà dans ton compte (« '+nm+' »).\n\nOK : reprendre ce plan.\nAnnuler : le remplacer par ton nouveau plan « '+pend.name+' ».'):(SETUP||confirm('Un plan existe déjà dans ton compte (« '+nm+' »).\n\nOK : le charger sur cet appareil (remplace les données d’ici).\nAnnuler : garder cet appareil et remplacer le plan du compte.'))){
        delete state.ui.pendingRace;cloudApply(j.data);a.sig=JSON.stringify(cloudPayload(true));a.t=j.updated||Date.now();save0();location.reload();return;
      }
    }
    if(pend){state.race=pend;delete state.ui.pendingRace;delete state.ui.guest;save0();return acctPush(true).then(function(){location.reload();});}
    save0();
    if(SETUP){toast('Bienvenue ! Choisis ta course');gateShown=false;trackOnce('setup_view');if(!typing())renderSetup();return;}

      if(gateShown)render(false);

}
function acctExport(){
  acctCall('GET','/pub/account/export').then(function(j){
    if(!j.ok)throw new Error(j.error||'Erreur');
    var txt=JSON.stringify(j.export,null,2);
    try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='mes-donnees-triient.json';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},500);toast('Export téléchargé');}
    catch(e){try{navigator.clipboard.writeText(txt);toast('Export copié dans le presse-papiers');}catch(x){toast('Export impossible');}}
  }).catch(function(e){toast('Export impossible : '+((e&&e.message)||e));});
}
function acctDelete(){
  if(!acct()||!confirm('Supprimer définitivement ton compte et toutes les données enregistrées sur nos serveurs ? Tes données restent sur cet appareil.'))return;
  acctCall('DELETE','/pub/account').then(function(j){
    if(!j.ok&&j.status!==401&&j.status!==404)throw new Error(j.error||'Erreur');
    delete state.ui.acct;save0();track('account_deleted','');toast('Compte supprimé');openSheet();
  }).catch(function(e){toast('Suppression impossible : '+((e&&e.message)||e));});
}
function loadGsi(cb){
  if(window.google&&window.google.accounts&&window.google.accounts.id)return cb();
  if(gsiLoading)return setTimeout(function(){loadGsi(cb);},300);
  gsiLoading=true;
  var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
  s.onload=function(){gsiLoading=false;cb();};s.onerror=function(){gsiLoading=false;cb(new Error('gsi'));};
  document.head.appendChild(s);
}
